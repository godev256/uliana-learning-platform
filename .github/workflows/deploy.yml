name: Test, publish GHCR images and deploy
on:
  push:
    branches: [main, codex/smooth-ink-icons]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ulianaa_test
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: ulianaa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ulianaa_test -d ulianaa_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://ulianaa_test:ci-test-only-password@127.0.0.1:5432/ulianaa_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Go format, vet, integration tests and race detector
        working-directory: backend-go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
          go build ./cmd/api ./cmd/admin ./cmd/import-local
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Production frontend
        run: npm run build
        env:
          VITE_GO_BACKEND: 'true'
      - name: Validate both container images without publishing
        if: github.ref != 'refs/heads/main'
        run: |
          docker build -t ulianaa-api:check backend-go
          docker build -t ulianaa-web:check .
          APP_DOMAIN=ulianaa-learning.pro API_DOMAIN=api.ulianaa-learning.pro docker run --rm -e APP_DOMAIN -e API_DOMAIN ulianaa-web:check caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: uliana-learning-api
            context: backend-go
            file: backend-go/Dockerfile
          - image: uliana-learning-web
            context: .
            file: Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/godev256/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install dedicated SSH credentials
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Pull immutable images and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          jq -n --arg username "$REGISTRY_USER" --arg token "$REGISTRY_TOKEN" '{username:$username, token:$token}' | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"
      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
